# Deploy the full Tahti stack (website, api, web, worker, orchestrator) to
# production via jumphost → root@192.168.2.100 (vimage), by running the same
# scripts/deploy_prod.sh a developer runs by hand today.
#
# Required repository secret:
#   DEPLOY_SSH_PRIVATE_KEY — ed25519 private key (authorized on jumphost + production)
#
# Optional repository variables (see "Export deploy targets" step for defaults):
#   DEPLOY_JUMP_HOST, DEPLOY_JUMP_USER, DEPLOY_JUMP_PORT
#   DEPLOY_HOST, DEPLOY_PATH, DEPLOY_USER
#
# Triggers:
#   - workflow_dispatch (manual, with optional --no-cache flag)
#   - CI workflow completed successfully on push to main (auto)
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Docker build --no-cache
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Check deploy key
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "${DEPLOY_KEY}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEPLOY_SSH_PRIVATE_KEY not set — skipping production deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Rsync and docker compose up
    needs: preflight
    if: >-
      needs.preflight.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_JUMP_USER: ${{ vars.DEPLOY_JUMP_USER }}
      DEPLOY_JUMP_HOST: ${{ vars.DEPLOY_JUMP_HOST }}
      DEPLOY_JUMP_PORT: ${{ vars.DEPLOY_JUMP_PORT }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      NODE_VERSION: '24'

    # packages/api-client/src/schema.d.ts is generated, never committed (see
    # ci.yml's "Regenerate SDK types" step). apps/web/Dockerfile's builder
    # stage only COPYs already-generated source — it has no network path to
    # a Postgres/Redis on the production host (postgres/redis publish no
    # host port; only pgbouncer does) — so the SDK types must be generated
    # here, on the runner, and rsynced up with the rest of the tree before
    # `docker compose build` runs on the production host.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tahti
          POSTGRES_PASSWORD: tahti_test
          POSTGRES_DB: tahti_test
        options: >-
          --health-cmd "pg_isready -U tahti -d tahti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      # Checked out under an explicit path (rather than $GITHUB_WORKSPACE
      # root) so the tahti-radio-discord-bot checkout below can sit next to
      # it as a true sibling directory — scripts/deploy_prod.sh looks for
      # ../tahti-radio-discord-bot relative to its own repo root, the same
      # layout a developer gets from cloning both repos side by side.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: tahti

      # Public repo, no extra token needed.
      - uses: actions/checkout@v7
        with:
          repository: janiluuk/tahti-radio-discord-bot
          path: tahti-radio-discord-bot

      # actions/checkout above puts the repo under tahti/, not $GITHUB_WORKSPACE
      # root, so pnpm/action-setup can't auto-detect the packageManager field
      # from tahti/package.json — pin the version explicitly (matches
      # packageManager: pnpm@9.0.0 and every Dockerfile's corepack prepare).
      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: tahti/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tahti
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: tahti
        run: pnpm --filter @tahti/db db:generate
        env:
          DATABASE_URL: postgres://tahti:tahti_test@localhost:5432/tahti_test

      - name: Push DB schema (test database)
        working-directory: tahti
        run: pnpm --filter @tahti/db db:migrate:test
        env:
          DATABASE_URL: postgres://tahti:tahti_test@localhost:5432/tahti_test

      - name: Regenerate SDK types
        working-directory: tahti
        run: pnpm --filter @tahti/api-client generate
        env:
          DATABASE_URL: postgres://tahti:tahti_test@localhost:5432/tahti_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Export deploy targets
        run: |
          jump_user="${DEPLOY_JUMP_USER:-pi}"
          jump_host="${DEPLOY_JUMP_HOST:-tahti.dudeisland.eu}"
          jump_port="${DEPLOY_JUMP_PORT:-4322}"
          {
            echo "DEPLOY_JUMP_USER=${jump_user}"
            echo "DEPLOY_JUMP_HOST=${jump_host}"
            echo "DEPLOY_JUMP_PORT=${jump_port}"
            echo "DEPLOY_HOST=${DEPLOY_HOST:-192.168.2.100}"
            echo "DEPLOY_PATH=${DEPLOY_PATH:-/srv/tahti}"
            echo "DEPLOY_USER=${DEPLOY_USER:-root}"
            echo "SSH_PROXY_JUMP=${jump_user}@${jump_host}:${jump_port}"
          } >> "$GITHUB_ENV"

      - name: Configure SSH agent
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"
          cat >> ~/.ssh/config <<CFG
          Host deploy-jump
            HostName ${DEPLOY_JUMP_HOST}
            Port ${DEPLOY_JUMP_PORT}
            User ${DEPLOY_JUMP_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m

          Host deploy-prod
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            ProxyJump deploy-jump
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m
          CFG
          chmod 600 ~/.ssh/config

      - name: Trust SSH host keys
        run: |
          set -euo pipefail
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -p "${DEPLOY_JUMP_PORT}" -H "${DEPLOY_JUMP_HOST}" >> ~/.ssh/known_hosts
          ssh deploy-jump "ssh-keyscan -H '${DEPLOY_HOST}'" >> ~/.ssh/known_hosts

      - name: Verify jumphost and production SSH
        run: |
          ssh deploy-jump 'echo "jumphost ok"'
          ssh deploy-prod "test -d '${DEPLOY_PATH}' && echo 'production ok'"

      # deploy_prod.sh rsyncs the checked-out tree to DEPLOY_HOST:DEPLOY_PATH
      # (excluding infra/stack.env, which only the copy already on the remote
      # host is authoritative for), builds website/api/web/worker/orchestrator
      # with --env-file infra/stack.env, and brings the stack up with
      # `docker compose up -d --remove-orphans` — no `down` step, so existing
      # named volumes (postgres, minio, redis) are preserved across deploys.
      - name: Deploy stack
        working-directory: tahti
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.no_cache }}" = "true" ]; then
            args+=(--no-cache)
          fi
          DEPLOY_HOST=deploy-prod RADIO_DISCORD_BOT_SRC="${GITHUB_WORKSPACE}/tahti-radio-discord-bot" ./scripts/deploy_prod.sh "${args[@]}"

      - name: Health check
        run: |
          ssh deploy-prod '
            set -euo pipefail
            curl -sfS http://127.0.0.1:15011/health
            curl -sfS -o /dev/null http://127.0.0.1:17777/
            curl -sfS -o /dev/null http://127.0.0.1:18080/
          '
