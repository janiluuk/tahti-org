# Remote ffmpeg transcode worker + GPU stem-separator — connects to the
# main stack over LAN.
#
# Lab: vimage7 (192.168.2.187, GTX 950) → vimage (192.168.2.100)
#
#   cp infra/stack.env.worker-remote.example infra/stack.env.worker-remote
#   # fill secrets to match vimage infra/stack.env
#   # one-time host prerequisite for stem-separator's GPU access:
#   #   docker plugin/toolkit: install the NVIDIA Container Toolkit on
#   #   vimage7 (apt package nvidia-container-toolkit, then
#   #   `nvidia-ctk runtime configure --runtime=docker && systemctl restart docker`)
#   ./scripts/deploy_worker_remote.sh
#
# worker-transcode processes only the `transcode` lane (see
# packages/shared/src/worker-job-lanes.ts): archive/release ffmpeg jobs that
# need Redis + Postgres + MinIO, not local HLS volumes. `separate-stems` is
# in that lane too, which is why stem-separator is colocated here rather
# than staying on vimage — same host, no network hop, and it's the only box
# in the fleet with a GPU.

name: tahti-worker-remote

services:
  worker-transcode:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    command: ['tsx', 'apps/worker/src/index.ts', '--queues=transcode']
    # Deliberately no depends_on: stem-separator's own startup can fail
    # (e.g. GPU toolkit not installed yet) without blocking this container —
    # matches the existing "not required to boot" resilience design; a
    # separate-stems job just fails on its own if stem-separator is down.
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tahti}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-tahti}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      # Colocated on this same host/compose project now — was
      # http://192.168.2.100:8090 (vimage) before stem-separator moved here.
      STEM_SEPARATOR_URL: http://stem-separator:8090
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      RTMP_KEY_ENC_KEY: ${RTMP_KEY_ENC_KEY:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-tahti-user-storage}
      # Extra headroom on a dedicated transcode box (vimage7: 15 GB RAM).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  # GPU-accelerated (see services/stem-separator/Dockerfile) — the only box
  # in the fleet with a GPU, so this doesn't run anywhere else. `docker
  # compose up` fails this service (not the others) until the NVIDIA
  # Container Toolkit is installed on the host — see the header comment.
  stem-separator:
    build:
      context: ..
      dockerfile: services/stem-separator/Dockerfile
    restart: unless-stopped
    ports:
      - '${STEM_SEPARATOR_PORT:-8090}:8090'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
