# Remote ffmpeg transcode worker — connects to the main stack over LAN.
#
# Lab: vimage7 (192.168.2.187) → vimage (192.168.2.100)
#
#   cp infra/stack.env.worker-remote.example infra/stack.env.worker-remote
#   # fill secrets to match vimage infra/stack.env
#   ./scripts/deploy_worker_remote.sh
#
# Processes only the `transcode` lane (see packages/shared/src/worker-job-lanes.ts):
# archive/release ffmpeg jobs that need Redis + Postgres + MinIO, not local HLS volumes.

name: tahti-worker-remote

services:
  worker-transcode:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    command: ['tsx', 'apps/worker/src/index.ts', '--queues=transcode']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tahti}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-tahti}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      STEM_SEPARATOR_URL: ${STEM_SEPARATOR_URL:-http://192.168.2.100:8090}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      RTMP_KEY_ENC_KEY: ${RTMP_KEY_ENC_KEY:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-tahti-user-storage}
      # Extra headroom on a dedicated transcode box (vimage7: 15 GB RAM).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
