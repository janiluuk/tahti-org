# Single-binary Loki, filesystem storage — matches the scale of the existing
# local Prometheus (prometheus.yml) rather than a multi-tenant/object-storage
# setup. Receives logs from every stack service via the `loki` Docker logging
# driver (see the `x-loki-logging` anchor in docker-stack.yml) — nothing
# ships to vimage6; Loki lives in this stack, right next to Prometheus and
# Grafana, so the `api` service can query it over the `internal` network with
# no new host/network exposure.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days — adjust alongside disk budget on the `role == db` node (loki_data
  # volume lives beside prometheus_data/grafana_data there).
  retention_period: 336h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
