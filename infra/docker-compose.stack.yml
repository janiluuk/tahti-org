# Full local Tahti stack — infra + API + web + worker + orchestrator.
# Not Swarm; use: ./scripts/stack-up.sh
#
# App UI:     http://localhost:17777  (override WEB_PORT)
# API:        http://localhost:15011  (override API_PORT)
# MailHog:    http://localhost:18025
# MinIO:      http://localhost:19001  (tahti / local-stack-minio-secret)

name: tahti-stack

# Ships every service's stdout/stderr to the Loki that's already running on
# vimage6 (monitoring-loki, host-networked, port 3100 — confirmed live, not
# something this change adds). vimage6 already has a Grafana Loki datasource
# provisioned (uid: loki-main) pointed at it, so nothing needed on the
# Grafana side. Requires the Loki Docker logging driver plugin installed on
# THIS host (vimage) before `docker compose up` picks up the change, or
# every service fails to start:
#   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: 'http://192.168.2.105:3100/loki/api/v1/push'
    loki-external-labels: 'service={{.Name}},job=tahti'
    loki-retries: '3'
    loki-batch-size: '400'
    mode: non-blocking
    max-buffer-size: 4m

x-app-env: &app-env
  NODE_ENV: production
  RELEASE_VERSION: ${RELEASE_VERSION:-dev}
  # PLAT-003: transaction pool via PgBouncer (migrations use direct postgres in db-push)
  # PROD: set POSTGRES_PASSWORD, SESSION_SECRET, INTERNAL_SECRET, DOCS_PASS, HCAPTCHA_SECRET,
  # MINIO_SECRET_KEY, CENTRIFUGO_JWT_SECRET, CENTRIFUGO_API_KEY in infra/stack.env — see
  # infra/stack.env.vimage.example. deploy_prod.sh passes that file via --env-file; without it
  # every value below falls back to a well-known dev default (fine for ./scripts/stack-up.sh,
  # never fine for a publicly reachable deploy).
  DATABASE_URL: postgresql://tahti:${POSTGRES_PASSWORD:-tahti_dev}@pgbouncer:5432/tahti?pgbouncer=true
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-do-not-use-in-prod}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-local-stack-internal-secret}
  DOCS_PASS: ${DOCS_PASS:-local-stack-docs-pass}
  HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-local-stack-hcaptcha-secret}
  SMTP_HOST: ${SMTP_HOST:-mailhog}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Tahti <noreply@tahti.live>}
  SUPPORT_INBOX: ${SUPPORT_INBOX:-support@tahti.live}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:19000}
  MINIO_ACCESS_KEY: tahti
  # SEC-005 (apps/api/src/config.ts) fatally refuses to boot in production if this
  # equals the literal dev sentinel — "local-stack-*" avoids that, matching the
  # pattern already used by INTERNAL_SECRET/DOCS_PASS/HCAPTCHA_SECRET above.
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-stack-minio-secret}
  MINIO_BUCKET: tahti
  # Cloudflare R2 — long-term lossless mirror for release tracks (apps/worker/src/lib/r2.ts).
  # Disabled (r2Enabled=false) until endpoint/access key/secret are all set — see
  # infra/stack.env.vimage.example.
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-tahti-user-storage}
  CENTRIFUGO_API_URL: http://chat:8000/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev}
  CENTRIFUGO_JWT_SECRET: ${CENTRIFUGO_JWT_SECRET:-dev_secret_do_not_use_in_prod}
  # RtmpTarget.streamKeyEnc at-rest encryption key (AES-256-GCM, 32 bytes/64 hex
  # chars) — api encrypts, orchestrator decrypts, both must agree. There's no
  # working built-in dev fallback for this one (the embedded default in
  # stream-key-enc.ts/liquidsoap.ts starts with "dev", which isn't valid hex and
  # always throws), so unlike the secrets above this needs an explicit value here.
  RTMP_KEY_ENC_KEY: ${RTMP_KEY_ENC_KEY:-abababababababababababababababababababababababababababababababab}
  ORCHESTRATOR_URL: http://orchestrator:3003
  # UVR5-family stem separation — GPU service (see services/stem-separator),
  # colocated with worker-transcode on vimage7 (the only box with a GPU),
  # not on this host — see infra/docker-compose.worker-remote.yml. Not
  # required to boot; the worker's separate-stems job just fails that one
  # job if unreachable.
  STEM_SEPARATOR_URL: ${STEM_SEPARATOR_URL:-http://192.168.2.187:8090}
  ICECAST_HOST: icecast:8000
  ICECAST_BASE_URL: http://icecast:8000
  ICECAST_PUBLIC_URL: ${ICECAST_PUBLIC_URL:-http://localhost:${ICECAST_PORT:-18100}}
  ICECAST_INGEST_HOSTS: ${ICECAST_INGEST_HOSTS:-}
  RTMP_INGEST_HOST: ${RTMP_INGEST_HOST:-rtmp-ingest}
  RTMP_INGEST_HEALTH_PORT: '8080'
  # STREAM-003: comma-separated public RTMP ingest hosts for OBS failover (second replica in prod)
  RTMP_INGEST_HOSTS: ''
  # STREAM-007: comma-separated public Icecast hosts for Mixxx failover (second replica in prod)
  ICECAST_INGEST_HEALTH_PATH: /status-json.xsl
  # STREAM-008 phase 3: optional AcoustID key for archive tracklist title lookup (https://acoustid.org/new-application)
  ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
  # MusicBrainz OAuth2 app for release/recording submission (https://musicbrainz.org/account/applications)
  MUSICBRAINZ_CLIENT_ID: ${MUSICBRAINZ_CLIENT_ID:-}
  MUSICBRAINZ_CLIENT_SECRET: ${MUSICBRAINZ_CLIENT_SECRET:-}
  ACRCLOUD_ENABLED: 'false'
  # Post-production: ACRCLOUD_ENABLED=true + keys; set orchestrator FINGERPRINT_SEND_AUDIO=1
  ACRCLOUD_HOST: identify-eu-west-1.acrcloud.com
  ACRCLOUD_ACCESS_KEY: ''
  ACRCLOUD_ACCESS_SECRET: ''
  HLS_BASE_URL: ${HLS_BASE_URL:-http://localhost:19000/hls-live}
  HLS_SEGMENT_ROOT: /hls
  HLS_MINIO_BUCKET: hls-live
  HLS_MINIO_PREFIX: hls-live
  HLS_STALE_SECONDS: '20'
  ARCHIVE_CACHE_ROOT: /archive-cache
  APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-17777}}
  # Self-serve /signup — closed in production unless SIGNUP_OPEN=true in stack.env
  SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
  API_URL: ${API_URL:-http://localhost:${API_PORT:-15011}}
  # PLAT-056: Revelator DSP distribution — obtain key at https://revelator.com; leave blank in dev
  REVELATOR_API_KEY: ${REVELATOR_API_KEY:-}
  # PLAT-057: Mixcloud archive upload OAuth — obtain prod credentials at https://www.mixcloud.com/developers/
  MIXCLOUD_CLIENT_ID: ${MIXCLOUD_CLIENT_ID:-}
  MIXCLOUD_CLIENT_SECRET: ${MIXCLOUD_CLIENT_SECRET:-}
  # PLAT-061: MaxMind GeoLite2 license key — for future geoip DB update automation (optional in dev)
  MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
  # Lab stack: higher rate limits so Playwright screenshot + journey suites do not trip 429 mid-run
  RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-120}
  RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-2000}
  # M16: 24/7 placeholder stream on /radio — video (YouTube/Vimeo) or audio (HLS)
  TAHTI_RADIO_STREAM_MODE: ${TAHTI_RADIO_STREAM_MODE:-video}
  TAHTI_RADIO_VIDEO_URL: ${TAHTI_RADIO_VIDEO_URL:-${TAHTI_RADIO_YOUTUBE_URL:-}}
  TAHTI_RADIO_AUDIO_URL: ${TAHTI_RADIO_AUDIO_URL:-${TAHTI_RADIO_HLS_URL:-}}

services:
  postgres:
    logging: *loki-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tahti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tahti_dev}
      POSTGRES_DB: tahti
    # No host port — isolated stack DB; seed via `docker compose exec` on the api service.
    volumes:
      - stack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tahti -d tahti']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgbouncer:
    logging: *loki-logging
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DATABASE_URL: postgres://tahti:${POSTGRES_PASSWORD:-tahti_dev}@postgres:5432/tahti
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '25'
    ports:
      - '${PGBOUNCER_PORT:-16432}:5432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '5432']
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  redis:
    logging: *loki-logging
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--loglevel', 'warning']
    volumes:
      - stack_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    logging: *loki-logging
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tahti
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-stack-minio-secret}
      # Go's GC defaults let heap grow ~2x the live set before collecting —
      # with hls-minio-sync PUTting dozens of small HLS segments every 4s
      # across 3 live channels, that churn keeps pushing RSS up over days of
      # uptime. GOMEMLIMIT gives the runtime a soft heap target to collect
      # back down to; GOGC=50 makes ordinary (non-limit-triggered) GC more
      # eager too. Trades some CPU for materially lower steady-state memory —
      # tune GOMEMLIMIT up if the extra GC pressure shows up as latency.
      GOMEMLIMIT: 2GiB
      GOGC: '50'
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - stack_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    logging: *loki-logging
    image: minio/mc:latest
    environment:
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-stack-minio-secret}
    depends_on:
      minio:
        condition: service_healthy
    # NOTE: tahti/collections is deliberately NOT anonymous-read — cover uploads
    # aren't gated by the collection's isPublic flag, so a blanket grant would leak
    # private ("Private Vault") collection cover images. Covers are served via
    # presigned URLs instead (resolveCollectionCoverUrl in apps/api).
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 tahti \"$$MINIO_SECRET_KEY\" &&
        mc mb --ignore-existing local/tahti &&
        mc mb --ignore-existing local/audio &&
        mc mb --ignore-existing local/covers &&
        mc mb --ignore-existing local/hls-live &&
        mc mb --ignore-existing local/recordings &&
        mc anonymous set download local/covers &&
        mc anonymous set download local/hls-live &&
        mc anonymous set download local/tahti/avatars &&
        mc anonymous set download local/tahti/press-kit &&
        mc anonymous set download local/tahti/posts &&
        mc anonymous set download local/tahti/archive &&
        echo 'MinIO buckets ready'
      "
    restart: 'no'

  chat:
    logging: *loki-logging
    image: centrifugo/centrifugo:v5
    command: centrifugo --config /centrifugo/config.json --port=8000 --health
    environment:
      # Centrifugo reads CENTRIFUGO_-prefixed env vars over the mounted config file, so
      # infra/stack.env can override the dev secrets baked into stack/centrifugo.dev.json
      # without needing a separate, untracked config file.
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_JWT_SECRET:-dev_secret_do_not_use_in_prod}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}
    volumes:
      - ./stack/centrifugo.dev.json:/centrifugo/config.json:ro
    ports:
      - '${CHAT_PORT:-18000}:8000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    logging: *loki-logging
    image: mailhog/mailhog:latest
    ports:
      - '${MAILHOG_SMTP_PORT:-15025}:1025'
      - '${MAILHOG_UI_PORT:-18025}:8025'

  icecast:
    logging: *loki-logging
    image: moul/icecast:latest
    user: '101:102'
    entrypoint: ['/usr/bin/icecast2']
    command: ['-n', '-c', '/etc/icecast2/icecast.xml']
    volumes:
      - ./stack/icecast.xml:/etc/icecast2/icecast.xml:ro
    ports:
      - '${ICECAST_PORT:-18100}:8000'

  # STREAM-007: optional second Icecast for local failover testing (`docker compose --profile icecast-failover up`)
  icecast-b:
    logging: *loki-logging
    profiles: ['icecast-failover']
    image: moul/icecast:latest
    user: '101:102'
    entrypoint: ['/usr/bin/icecast2']
    command: ['-n', '-c', '/etc/icecast2/icecast.xml']
    volumes:
      - ./stack/icecast.xml:/etc/icecast2/icecast.xml:ro
    ports:
      - '${ICECAST_B_PORT:-18101}:8000'

  rtmp-ingest:
    logging: *loki-logging
    image: tiangolo/nginx-rtmp:latest
    volumes:
      - ./stack/nginx-rtmp.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${RTMP_PORT:-1935}:1935'
    depends_on:
      api:
        condition: service_healthy

  # STREAM-003: optional second RTMP ingest for local failover testing
  rtmp-ingest-b:
    logging: *loki-logging
    profiles: ['rtmp-failover']
    image: tiangolo/nginx-rtmp:latest
    volumes:
      - ./stack/nginx-rtmp.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${RTMP_B_PORT:-1936}:1935'
      - '${RTMP_B_HEALTH_PORT:-8086}:8080'
    depends_on:
      api:
        condition: service_healthy

  db-push:
    logging: *loki-logging
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      # Migrations bypass PgBouncer (transaction pooling breaks Prisma migrate)
      DATABASE_URL: postgresql://tahti:${POSTGRES_PASSWORD:-tahti_dev}@postgres:5432/tahti
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter @tahti/db exec prisma db push --accept-data-loss']
    restart: 'no'

  api:
    logging: *loki-logging
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    environment:
      <<: *app-env
      PORT: '3001'
    ports:
      - '${API_PORT:-15011}:3001'
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  web:
    logging: *loki-logging
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Browser-side fetches (e.g. the Spotify/Mixcloud cover-art proxies) can't reach the
      # `api` service name — they need a browser-reachable address, not API_URL's
      # docker-network one. Defaults to the host-mapped port for local stack use;
      # PROD: set NEXT_PUBLIC_API_BASE/NEXT_PUBLIC_API_URL in infra/stack.env to the
      # public API hostname, since these are baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:${API_PORT:-15011}}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-15011}}
        NEXT_PUBLIC_CENTRIFUGO_WS: ${NEXT_PUBLIC_CENTRIFUGO_WS:-ws://localhost:${CHAT_PORT:-18000}/connection/websocket}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${WEB_PORT:-17777}}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
        SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
    environment:
      <<: *app-env
      API_URL: http://api:3001
      PORT: '3000'
    ports:
      - '${WEB_PORT:-17777}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

  worker:
    logging: *loki-logging
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    command: ['tsx', 'apps/worker/src/index.ts', '--queues=media,light,dist']
    environment:
      <<: *app-env
      RECORDINGS_ROOT: /recordings
      HLS_SEGMENT_ROOT: /hls
      ARCHIVE_CACHE_ROOT: /archive-cache
      # hls-minio-sync must tick every ~4s or the public ~16s HLS window runs
      # dry (listeners buffer). With concurrency 1, the once-a-minute
      # channel-watchdog (and other crons) blocked that tick for ~40s —
      # confirmed live as playlist Last-Modified stalls then +10 segment jumps.
      WORKER_CONCURRENCY: '4'
    volumes:
      - stack_hls:/hls:ro
      - stack_recordings:/recordings:ro
      - stack_archive_cache:/archive-cache
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # stem-separator moved to vimage7 (GPU) — see
  # infra/docker-compose.worker-remote.yml. Nothing runs on this host for it
  # anymore; STEM_SEPARATOR_URL above points there instead.

  orchestrator:
    logging: *loki-logging
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    environment:
      <<: *app-env
      PORT: '3003'
      # Liquidsoap containers pull fallback.m3u from this URL — must be the
      # docker-network address, not the host-mapped / public API_URL from stack.env.
      API_URL: http://api:3001
      FFMPEG_IMAGE: jrottenberg/ffmpeg:6-alpine
      ICECAST_BASE_URL: http://icecast:8000
      RTMP_INGEST_URL: rtmp://rtmp-ingest:1935
      HLS_VOLUME: tahti_stack_hls
      RECORDINGS_VOLUME: tahti_stack_recordings
      ARCHIVE_CACHE_VOLUME: tahti_stack_archive_cache
      COVER_CACHE_VOLUME: tahti_stack_cover_cache
      LIQUIDSOAP_CONFIG_VOLUME: tahti_stack_liquidsoap_configs
      LIQUIDSOAP_CONFIG_MOUNT: /liquidsoap-configs
      FINGERPRINT_SEND_AUDIO: '0'
    ports:
      - '${ORCHESTRATOR_PORT:-15003}:3003'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - stack_hls:/hls
      - stack_recordings:/recordings
      - stack_archive_cache:/archive-cache
      - stack_liquidsoap_configs:/liquidsoap-configs
      - ./liquidsoap-channel.liq.template:/srv/liquidsoap-channel.liq.template:ro
      - ./liquidsoap-rotation.liq.template:/srv/liquidsoap-rotation.liq.template:ro
    depends_on:
      api:
        condition: service_healthy

  website:
    logging: *loki-logging
    build:
      context: ../website
      dockerfile: Dockerfile
    ports:
      - '${WEBSITE_PORT:-18080}:80'
    profiles: ['marketing']

volumes:
  stack_postgres:
  stack_redis:
  stack_minio:
  stack_hls:
    name: tahti_stack_hls
  stack_recordings:
    name: tahti_stack_recordings
  stack_archive_cache:
    name: tahti_stack_archive_cache
  stack_cover_cache:
    name: tahti_stack_cover_cache
  stack_liquidsoap_configs:
    name: tahti_stack_liquidsoap_configs
