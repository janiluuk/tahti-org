
# nginx-rtmp-module keeps live-stream buffers in per-worker memory only — there's
# no shared-memory relay between workers. With worker_processes > 1, a publisher
# and a player for the same stream name can land on different workers (the OS
# load-balances accepted connections across them), and nginx then accepts both
# connections individually but never actually relays any bytes between them —
# no error, just a silently stuck 0 bytes_out forever. This is what blocked the
# edge encoder from ever receiving audio: it always connects as a separate TCP
# session from the publisher. One worker is the standard, documented setup for
# nginx-rtmp; this ingest point is a lightweight relay, not CPU-bound work, so
# it doesn't need more.
worker_processes 1;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 200;

        application live {
            live on;
            record off;

            on_publish http://api:3001/internal/rtmp/on_publish;
            on_done    http://api:3001/internal/rtmp/on_done;
            on_update  http://api:3001/internal/rtmp/on_update;
            notify_update_timeout 30s;

            # No on-disk HLS output here — the orchestrator spins up a per-channel ffmpeg
            # "edge encoder" that pulls this RTMP feed directly (rtmp://rtmp-ingest:1935/live/<slug>)
            # and re-encodes for Liquidsoap. nginx's own hls_path was unused dead config that
            # crashed the container on every start (mkdir() on an unmounted /srv/hls).
            #
            # The edge encoder itself is that one legitimate PLAY client — it runs as its own
            # container on this same private Docker/Swarm network, never on a public IP. Allow
            # the standard RFC1918 ranges (covers every Docker bridge/overlay subnet regardless
            # of which one this compose project happens to get assigned) before the deny-all, so
            # raw RTMP stays unreachable from the public internet while the internal relay works.
            allow play 10.0.0.0/8;
            allow play 172.16.0.0/12;
            allow play 192.168.0.0/16;
            deny play all;
        }
    }
}

http {
    server {
        listen 8080;
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
