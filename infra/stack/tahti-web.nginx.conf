# Local-stack nginx for the tahti-web (Nuclear UI) beta client.
# Same SPA fallback as deploy/nginx.conf, but API/chat-adjacent paths proxy
# to the stack-local `api` service instead of https://api.tahti.live.
# Local-only file: not referenced by production deploys.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API → stack-local Tahti API (cookies work, no CORS needed).
    location ^~ /tahti-api/ {
        rewrite ^/tahti-api/(.*)$ /$1 break;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Disco-widget bundle proxy → stack-local API.
    location ~ "^/widget-sandbox/bundle/([0-9a-f]{64})$" {
        rewrite ^/widget-sandbox/bundle/(.*)$ /api/v1/disco-widgets/bundle/$1 break;
        proxy_pass http://api:3001;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
